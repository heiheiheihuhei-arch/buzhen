<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>画阵</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap">
<style>
/* 沙盘推演：深木框围着一块沙土台面，兵是涂了色的小棋子，敌人是一片暗红的潮水 */
:root {
  --frame: #1f1913; --frame-2: #2c241b; --rim: #5a4630;
  --ink: #f1e7d3; --dim: #a39176; --gold: #e6b65a; --red: #c8442f; --ok: #6fbf6a;
  --shield: #3f62a0; --spear: #a35f28; --bow: #3c8a4c; --fire: #e0672a; --horse: #7b4b8e;
  --brush: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", serif;
  --ui: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--frame); color: var(--ink); font-family: var(--ui);
  overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { height: 100%; display: flex; flex-direction: column; gap: 6px; padding-block: 6px; max-width: 520px; margin: 0 auto; }
.lbl { font-family: var(--brush); color: var(--dim); font-size: 18px; line-height: 1; }
b { font-variant-numeric: tabular-nums; font-weight: 700; }

#hud { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
#hud > div { display: flex; align-items: center; gap: 6px; }
#hud b { font-size: 18px; }
#kills { color: var(--gold); min-width: 3ch; text-align: right; }
.bar { position: relative; flex: 1; height: 10px; background: var(--frame-2); border: 1px solid var(--rim); border-radius: 5px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--red); transition: width .15s; }
.bar.vs { background: var(--red); }
.bar.vs i { background: var(--shield); }
#mine, #foes { min-width: 3.5ch; font-size: 14px; text-align: right; }

#intel { font-size: 11.5px; line-height: 1.5; background: var(--frame-2); border: 1px solid var(--rim); border-radius: 8px; padding: 5px 9px; display: flex; flex-direction: column; gap: 1px; }
#intel b { font-weight: 700; color: var(--gold); }
#intel .mod { display: inline-block; background: var(--red); color: var(--ink); border-radius: 4px; padding: 0 5px; margin: 0 4px 0 6px; font-size: 11px; }
#intel .new { display: inline-block; background: var(--gold); color: var(--frame); border-radius: 4px; padding: 0 4px; font-size: 10px; font-weight: 700; }
#stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#cv { display: block; touch-action: none; border-radius: 6px; box-shadow: 0 0 0 3px var(--rim), 0 8px 24px rgba(0,0,0,.5); }

footer { display: flex; flex-direction: column; gap: 6px; }
.inkrow { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
.inkrow b { color: var(--gold); font-size: 15px; }
.grade { text-align: center; font: 64px/1 "Ma Shan Zheng", KaiTi, serif; margin: 2px 0 6px; }
.grade.S { color: #ffd76a; } .grade.A { color: #e6b65a; } .grade.B { color: #c9b48a; } .grade.C, .grade.D { color: var(--dim); }
.reward { text-align: center; font-size: 13px; color: var(--dim); margin-bottom: 12px; line-height: 1.7; }
.reward b { color: var(--gold); font-size: 16px; }
#tools { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
#forms { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); }
#forms button { appearance: none; flex: 1; border: 1px solid var(--rim); background: var(--frame-2); color: var(--ink); border-radius: 7px; padding: 4px 0; font: 12px var(--ui); cursor: pointer; }
#forms button small { color: var(--dim); font-size: 10px; margin-left: 3px; }
#forms button.save { flex: 0 0 auto; padding: 4px 10px; }
#forms button.on { border-color: var(--gold); background: #4a3a22; color: var(--gold); }
#forms.locked button { opacity: .38; pointer-events: none; }
.tool {
  appearance: none; border: 1px solid var(--rim); background: var(--frame-2); color: var(--ink);
  border-radius: 8px; padding: 4px 0 3px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  font-family: var(--ui); cursor: pointer; position: relative;
}
.tool .g { font-family: var(--brush); font-size: 24px; line-height: 1.05; }
.tool small { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
.tool .sw { position: absolute; top: 5px; left: 5px; width: 7px; height: 7px; border-radius: 2px; }
.tool.on { border-color: var(--gold); background: #4a3a22; box-shadow: inset 0 0 0 1px var(--gold); }
.tool:disabled { opacity: .38; cursor: default; }
.tool:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#fight { appearance: none; border: 0; border-radius: 10px; padding: 10px; font-family: var(--brush); font-size: 22px; letter-spacing: .15em;
  background: var(--red); color: var(--ink); cursor: pointer; }
#fight:disabled { background: var(--frame-2); color: var(--dim); font-family: var(--ui); font-size: 13px; letter-spacing: 0; cursor: default; border: 1px solid var(--rim); }
#fight:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#tools.locked .tool { opacity: .38; pointer-events: none; }
#combos { font-size: 11px; color: var(--dim); text-align: center; min-height: 1.3em; letter-spacing: .02em; }
#combos em { color: var(--gold); font-style: normal; }

.ov { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20,15,10,.55); padding: 12px; }
.panel { background: var(--frame-2); border: 1px solid var(--rim); border-radius: 12px; padding: 18px 18px 16px; max-width: 340px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
.panel h1 { font-family: var(--brush); font-weight: 400; font-size: 52px; margin: 0 0 6px; text-align: center; color: var(--gold); letter-spacing: .1em; }
.panel h2 { font-family: var(--brush); font-weight: 400; font-size: 30px; margin: 0 0 10px; text-align: center; }
.panel p { margin: 0 0 8px; font-size: 13px; line-height: 1.6; color: var(--ink); }
.panel ul { margin: 0 0 12px; padding-left: 1.1em; font-size: 12px; line-height: 1.7; color: var(--dim); }
.panel ul b { color: var(--ink); font-weight: 600; }
.go { appearance: none; display: block; width: 100%; border: 0; border-radius: 10px; padding: 11px; font-size: 18px; font-family: var(--brush);
  background: var(--red); color: var(--ink); cursor: pointer; letter-spacing: .2em; }
.go:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { appearance: none; text-align: left; border: 1px solid var(--rim); background: var(--frame); color: var(--ink); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-family: var(--ui); }
.card:hover, .card:focus-visible { border-color: var(--gold); outline: none; }
.card b { display: block; font-size: 15px; margin-bottom: 2px; }
.card span { font-size: 12px; color: var(--dim); }
.card.new { border-color: var(--gold); }
.card .tag { font-style: normal; font-size: 11px; font-weight: 500; color: var(--frame); background: var(--dim); border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
.card.paid .tag { background: var(--gold); }
.card.paid { border-color: var(--gold); background: linear-gradient(180deg, #4a3418, #2e2012); }
.card.paid em { float: right; font-style: normal; color: var(--gold); font-size: 13px; }
.card:disabled { opacity: .5; cursor: default; }
.paidlbl { font-size: 12px; color: var(--dim); margin-top: 6px; text-align: center; }
.stat { text-align: center; color: var(--dim); font-size: 13px; margin-bottom: 14px; }
.stat b { color: var(--gold); font-size: 22px; }
</style>

<div id="app">
  <header id="hud">
    <div><span class="lbl">波</span><b id="wave">1</b></div>
    <div><span class="lbl">我</span><b id="mine">0</b><div class="bar vs"><i id="vsFill"></i></div><b id="foes">0</b><span class="lbl">敌</span></div>
    <div><span class="lbl">斩</span><b id="kills">0</b></div>
  </header>

  <div id="intel" hidden></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ov" class="ov"></div>
  </div>

  <footer>
    <div class="inkrow"><span>金币</span><b id="goldTxt">0</b><span id="goldTip"></span></div>
    <div id="tools"></div>
    <div id="forms"></div>
    <div id="combos"></div>
    <button id="fight" disabled>开战</button>
  </footer>
</div>

<script>
'use strict';
// ---------- 场地：36×60 的小格子，每格 10 个单位，一格站一个兵 ----------
const COLS = 36, ROWS = 60, CS = 10, W = COLS * CS, H = ROWS * CS;
const SPAWN_ROWS = 5;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { shield: css('--shield'), spear: css('--spear'), bow: css('--bow'), fire: css('--fire'), horse: css('--horse'), gold: css('--gold'), red: css('--red') };

// 兵种（每局开始时复制一份，升级改的是复制的那份）
const BASE_TYPES = {
// cap = 手里有几个这种兵（场上的也算）；弓兵箭不限量
  shield: { name: '盾', cost: 1, hp: 14, cap: 20, color: COL.shield },
  spear:  { name: '枪', cost: 1, hp: 10, dmg: 2, cd: 0.55, range: 23, cap: 30, color: COL.spear },
  bow:    { name: '弓', cost: 2, hp: 5, dmg: 2, cd: 0.9, range: 78, cap: 16, color: COL.bow },
  horse:  { name: '骑', cost: 3, hp: 18, dmg: 2.5, cd: 0.8, range: 9, cap: 6, color: COL.horse }, // 不跟阵走：有弓手、投石车就先扑它们，没有就等前排接上敌人再冲；跑够 3 格后撞上去，踩一片 ×3
};
const MOVE = { shield: 42, spear: 33, bow: 24, horse: 75 }; // 盾快、枪一般、弓慢、骑很快（敌我一样）
// 敌兵：和我方一样是盾、枪、弓、骑四种，基础数值直接取我方的（我方过关强化、阵法加成不算）。pts = 兵力，和我方招兵花费一样
const foeOf = (k, o) => { const t = BASE_TYPES[k]; return { name: t.name, pts: t.cost, hp: t.hp, dmg: t.dmg || 0, cd: t.cd || 1, spd: MOVE[k], ...o }; };
const FOES = {
  shield: foeOf('shield', { r: 3.4, guard: true, color: '#6b2a22', shape: 'msq', tip: '和你的盾兵一样：不砍人，挡在前面；身后有弓兵就护着弓兵，箭射不过去' }),
  spear:  foeOf('spear',  { r: 3.1, reach: BASE_TYPES.spear.range, color: '#9a3a1c', shape: 'mtri', tip: '和你的枪兵一样：能隔着一格戳人' }),
  bow:    foeOf('bow',    { r: 2.9, range: BASE_TYPES.bow.range, color: '#6e2350', shape: 'mbow', tip: '和你的弓兵一样：射得远、血薄；你的盾兵能挡它的箭' }),
  horse:  foeOf('horse',  { r: 3.7, charge: 3, color: '#4a1a2e', shape: 'mhorse', tip: '和你的骑兵一样：跑得快，跑起来撞第一下三倍伤害，还能踩到旁边的人' }),
};

let T, grid, soldiers, enemies, shots, parts, floats;
let wave, kills, gold, fightN, foeLost = 0, state, sp, flowDirty, shake, combos;
let tool = 'shield', thick = true, drawing = false, lastPt = null, inkWarnT = 0, bannerT = 0, bannerTxt = '';
const dist = new Float32Array(COLS * ROWS);
const buckets = Array.from({ length: COLS * ROWS }, () => []);
const usedB = [];

function reset() {
  T = JSON.parse(JSON.stringify(BASE_TYPES));
  for (const k in T) T[k].color = BASE_TYPES[k].color;
  grid = new Array(COLS * ROWS).fill(null); units = Array.from({ length: COLS * ROWS }, () => []);
  soldiers = []; enemies = []; shots = []; parts = []; floats = [];
  recentArmies = []; seenFoes = new Set(); sp = null; showIntel();
  wave = 0; lastPlan = null; kills = 0; gold = 0; fightN = 1; fallen = [];
  state = 'start'; sp = null; flowDirty = true; shake = 0;
  // 开局送一个示范阵：一排盾，后面一排枪，再后面一排弓
  for (let c = 9; c <= 26; c++) place(c, 36, 'shield', true);
  for (let c = 9; c <= 26; c++) place(c, 37, 'spear', true);
  for (let c = 11; c <= 24; c++) place(c, 39, 'bow', true);
  tool = 'shield';
  buildTools(); recalcBuffs(); computeFlow();
}

// ---------- 摆兵 / 撤兵 ----------
// 只有最上面敌人出生的几行、和每波敌阵的红区不能放兵；左右、下边都能画到底
const drawable = (c, r) => c >= 0 && c < COLS && r >= SPAWN_ROWS && r < ROWS && !(foeZone && foeZone[r * COLS + c]);
let foeZone = null; // 敌阵占的格子（外加两格），准备阶段不能往里画
function place(c, r, type, free) {
  if (!drawable(c, r)) return false;
  const i = r * COLS + c;
  if (grid[i]) return false;
  const t = T[type];
  if (!free && countOf(type) >= ownOf(type)) return 'cap';
  const s = { type, i, c, r, hc: c, hr: r, x: c * CS + CS / 2, y: r * CS + CS / 2, hp: t.hp, max: t.hp, cdT: Math.random() * 0.5, pop: 1 };
  cellAdd(i, s); soldiers.push(s); flowDirty = true;
  return true;
}
const ownOf = k => T[k].cap; // 手里一共有几个（含场上的）；没有另外的上限，有多少就能摆多少
let fallen = []; // 这波战死的兵（兵种和位置），打完原地补回来
const countOf = k => soldiers.reduce((n, s) => n + (!s.dead && s.type === k ? 1 : 0), 0);
function removeAt(i, refund) { if (grid[i]) killSoldier(grid[i], refund); }
function killSoldier(s, refund) {
  if (!refund) fallen.push({ type: s.type, c: s.hc, r: s.hr });
  cellDel(s.i, s); s.dead = true; flowDirty = true;
}
// 一格最多站 3 个兵（画的时候还是一格一个；开打后走动时可以挤过去、叠着站）
// units[i] = 这格里的兵；grid[i] = 其中第一个（敌人砍的、算阵法加成的都看它）
let units = [];
const CELL_MAX = 3, OFS = [[0, 0], [-2.6, 2], [2.6, -2]];
function cellAdd(i, s) { units[i].push(s); grid[i] = units[i][0]; }
function cellDel(i, s) { const a = units[i], k = a.indexOf(s); if (k >= 0) a.splice(k, 1); grid[i] = a[0] || null; }
const roomAt = j => units[j].length < CELL_MAX && !buckets[j].length; // 还能挤进去、里面没敌人
function stamp(x, y) {
  const c = Math.floor(x / CS), r = Math.floor(y / CS);
  const R = thick ? 1 : 0;
  let placed = 0, short = false, capped = false;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    const cc = c + dx, rr = r + dy;
    if (tool === 'erase') { if (cc >= 0 && cc < COLS && rr >= 0 && rr < ROWS) removeAt(rr * COLS + cc, true); continue; }
    if (!drawable(cc, rr)) continue;
    const old = grid[rr * COLS + cc];
    if (old && old.type === tool) continue;
    // 画在别的兵种上 = 换掉：旧的收回手里，新的站上去（手里没这种兵了就不动）
    if (old) { if (countOf(tool) >= ownOf(tool)) { capped = true; continue; } removeAt(old.i, true); }
    const ok = place(cc, rr, tool);
    if (ok === true) placed++; else if (ok === 'cap') capped = true; else short = true;
  }
  if ((short || capped) && inkWarnT <= 0) { floats.push({ x, y: y - 10, text: `${T[tool].name}兵用完了`, life: 0.9, color: '#d9d2ff' }); inkWarnT = 0.9; }
  if (placed || tool === 'erase') { recalcBuffs(); buildTools(); }
}

// ---------- 阵法加成：挨着谁 ----------
// 盾挨盾 = 盾墙（受伤 -40%）；枪挨盾 = 盾枪（伤害 +60%）；弓挨盾 = 盾弓（射速 +50%）；
// 枪挨 ≥3 枪 = 枪林（打它的敌人被反伤）
function recalcBuffs() {
  combos = { 盾墙: 0, 盾枪: 0, 盾弓: 0, 枪林: 0 };
  soldiers = soldiers.filter(s => !s.dead);
  for (const s of soldiers) {
    const n = { shield: 0, spear: 0, bow: 0, horse: 0 };
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const c = s.c + dx, r = s.r + dy;
      if (c < 0 || c >= COLS || r < 0 || r >= ROWS) continue;
      const o = grid[r * COLS + c]; if (o) n[o.type]++;
    }
    s.wall = s.type === 'shield' && n.shield >= 2;
    s.dmgMul = s.type === 'spear' && n.shield ? 1.6 : 1;
    s.rateMul = s.type === 'bow' && n.shield ? 1.5 : 1;
    s.thorn = s.type === 'spear' && n.spear >= 3;
    s.buffed = s.wall || s.dmgMul > 1 || s.rateMul > 1 || s.thorn;
    if (s.wall) combos.盾墙++;
    if (s.dmgMul > 1) combos.盾枪++;
    if (s.rateMul > 1) combos.盾弓++;
    if (s.thorn) combos.枪林++;
  }
  const lines = Object.entries(combos).filter(([, v]) => v).map(([k, v]) => `${k} <em>${v}</em>`);
  document.getElementById('combos').innerHTML = lines.length ? lines.join(' · ') : '盾挨盾、枪挨盾、弓挨盾都有加成';
}

// ---------- 敌人的路：从每个兵往外算每格离最近的兵有多远，敌人顺着往下走 = 直接冲最近的兵 ----------
function computeFlow() {
  dist.fill(1e9);
  const hd = [], hi = [];
  const push = (d, i) => {
    hd.push(d); hi.push(i); let k = hd.length - 1;
    while (k > 0) { const p = (k - 1) >> 1; if (hd[p] <= hd[k]) break; [hd[p], hd[k]] = [hd[k], hd[p]]; [hi[p], hi[k]] = [hi[k], hi[p]]; k = p; }
  };
  const pop = () => {
    const d = hd[0], i = hi[0], ld = hd.pop(), li = hi.pop();
    if (hd.length) {
      hd[0] = ld; hi[0] = li; let k = 0;
      for (;;) { const l = 2 * k + 1, r = l + 1; let m = k;
        if (l < hd.length && hd[l] < hd[m]) m = l; if (r < hd.length && hd[r] < hd[m]) m = r;
        if (m === k) break; [hd[m], hd[k]] = [hd[k], hd[m]]; [hi[m], hi[k]] = [hi[k], hi[m]]; k = m; }
    }
    return [d, i];
  };
  for (const s of soldiers) if (!s.dead) { dist[s.i] = 0; push(0, s.i); }
  while (hd.length) {
    const [d, i] = pop(); if (d > dist[i]) continue;
    const c = i % COLS, r = (i / COLS) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const cc = c + dx, rr = r + dy; if (cc < 0 || cc >= COLS || rr < 0 || rr >= ROWS) continue;
      const j = rr * COLS + cc; if (grid[j]) continue;
      const nd = d + 1;
      if (nd < dist[j]) { dist[j] = nd; push(nd, j); }
    }
  }
  flowDirty = false;
}

// ---------- 波次 ----------
// 一波 = 一个「军势」（从哪几路来、什么兵、隔多久）+ 可能有的「天时」+ 随机混进来的杂兵。
// 准备阶段就把这些摆出来给玩家看，让玩家针对着布阵；点「开战」才出兵，打起来就不能再上兵。
const DIRS = { N: ['正面', '↓'], W: ['左翼', '→'], E: ['右翼', '←'], S: ['背后', '↑'], T: ['地道', '◎'] };
const side = () => Math.random() < 0.5 ? 'W' : 'E';
const ARMIES = [
  { name: '正面强攻', from: 1, g: () => [{ d: 'N', s: 1, mix: { shield: .3, spear: .5, bow: .2 } }] },
  { name: '前后两拨', from: 1, g: () => [{ d: 'N', s: .5, mix: { shield: .4, spear: .6 } }, { d: 'N', s: .5, mix: { spear: .6, bow: .4 }, delay: 5 }] },
  { name: '铁骑突袭', from: 2, g: () => [{ d: 'N', s: .55, mix: { shield: .4, spear: .6 } }, { d: side(), s: .45, mix: { horse: 1 }, delay: 3 }] },
  { name: '两翼包抄', from: 2, g: () => [{ d: 'W', s: .35, mix: { spear: .6, horse: .4 } }, { d: 'E', s: .35, mix: { spear: .6, horse: .4 } }, { d: 'N', s: .3, mix: { shield: .5, spear: .5 } }] },
  { name: '弓弩压阵', from: 2, g: () => [{ d: 'N', s: .5, mix: { shield: .5, spear: .5 } }, { d: 'N', s: .5, mix: { shield: .3, bow: .7 }, delay: 2 }] },
  { name: '盾墙推进', from: 3, g: () => [{ d: 'N', s: 1, mix: { shield: .5, spear: .5 } }] },
